<title id="title">Research appointments: explicitly declared conceptual types</title>
<desc id="desc">Researcher Role specializes Person Kind. Appointment Relator has separate mediation relations to at least one Person and at least one Organization, each reverse end zero to many. Mass Quality characterizes one Person. Person participates in Seminar Event with many-to-many model multiplicity. This source candidate has no canonical acceptance; generic SHACL does not enforce the independent typed mediation minima.</desc>
